<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px;
    background: #17161a;
    color: #efeadf;
    font-family: Inter, sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 62px 70px 58px;
    overflow: hidden;
  }
  .kicker {
    font-family: "JetBrains Mono", monospace;
    font-size: 17px; letter-spacing: 0.16em; text-transform: uppercase;
    color: #8b8578; display: flex; align-items: center; gap: 14px;
  }
  .led { width: 13px; height: 13px; border-radius: 50%; background: #e08a3c; }
  h1 {
    font-family: Fraunces, Georgia, serif; font-weight: 500;
    font-size: 148px; line-height: 0.9; letter-spacing: -0.045em;
    margin: 26px 0 18px;
  }
  p.sub { font-size: 29px; line-height: 1.35; color: #cfc9bc; max-width: 830px; }
  .streifen { display: flex; gap: 3px; align-items: flex-end; height: 60px; margin: 0 0 34px; }
  .stunde { flex: 1 1 0; height: 100%; display: flex; align-items: flex-end; }
  .stunde i { display: block; width: 100%; height: 22%; background: #33313a; border-radius: 1px; }
  .stunde.an i { height: 100%; background: linear-gradient(180deg, #e08a3c, #a8481a); }
  .stunde b { display: none; }
  .reihe { display: flex; gap: 62px; border-top: 1px solid #35323b; padding-top: 26px; }
  .zahl b {
    display: block;
    font-family: "JetBrains Mono", monospace; font-weight: 700;
    font-size: 46px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
  }
  .zahl span { font-size: 17px; color: #8b8578; }
  .zahl b em { color: #e08a3c; font-style: normal; }
</style>
</head>
<body>
  <div>
    <p class="kicker"><span class="led"></span> otto.jenslaufer.com</p>
    <h1>Otto</h1>
    <p class="sub">Claude ist das Gehirn. Den Harness drumherum hat Jens gebaut:
       ein Mini-PC im Keller, Telegram als einziger Kanal.</p>
  </div>
  <div>
  <div class="streifen">{{ZEITSTREIFEN}}</div>
  <div class="reihe">
    <div class="zahl"><b>{{NACHRICHTEN}}</b><span>Nachrichten von Jens</span></div>
    <div class="zahl"><b>{{SITZUNGEN}}</b><span>protokollierte Sitzungen</span></div>
    <div class="zahl"><b>{{AUFTRAEGE}}</b><span>Nachtaufträge</span></div>
    <div class="zahl"><b>{{TAGE}}</b><span>Tage</span></div>
  </div>
  </div>
</body>
</html>
